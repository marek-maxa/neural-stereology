repos:
  - repo: local
    hooks:
      - id: ruff-critical
        name: ruff critical checks
        entry: uv run --frozen --group dev ruff check --no-fix --select E9,F63,F7,F82
        language: system
        types: [python]
      - id: sanity-tests
        name: quick sanity tests
        entry: uv run --frozen --group dev pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: nbstripout
        name: strip notebook outputs
        entry: uv run --frozen --group dev nbstripout
        language: system
        types: [jupyter]
