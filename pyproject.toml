[project]
name = "neural-stereology"
version = "0.1.0"
description = "Research codebase for stereology-related structure generation and future learning workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crystals>=1.7.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "orix>=0.15.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
]

[dependency-groups]
dev = [
    "ipympl>=0.9.0",
    "jupyterlab>=4.0.0",
    "nbstripout>=0.8.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_stereology"]

[tool.uv]
package = true
